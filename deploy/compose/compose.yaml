name: ${PROJECT_NAME:-castor}

x-api: &api
  image: ${API_IMAGE:?Set API_IMAGE}
  environment: &api-env
    CASTOR_INSTANCE_ID: ${CASTOR_INSTANCE_ID:-castor}
    CASTOR_JWT_KEY: ${CASTOR_JWT_KEY:?Set CASTOR_JWT_KEY}
    CASTOR_RSA_SECRET: ${CASTOR_RSA_SECRET:?Set CASTOR_RSA_SECRET}
    CASTOR_DATA_KEY: ${CASTOR_DATA_KEY:?Set CASTOR_DATA_KEY}
    CASTOR_PUBLIC_URL: ${CASTOR_PUBLIC_URL:-}
    CASTOR_DB_HOST: ${CASTOR_DB_HOST:-postgres}
    CASTOR_DB_PORT: ${CASTOR_DB_PORT:-5432}
    CASTOR_DB_USER: ${POSTGRES_USER:-castor}
    CASTOR_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    CASTOR_DB_NAME: ${POSTGRES_DB:-castor}
    CASTOR_REDIS_ADDR: ${CASTOR_REDIS_ADDR:-redis:6379}
    CASTOR_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    CASTOR_S3_ENDPOINT: ${CASTOR_S3_ENDPOINT:-rustfs:9000}
    CASTOR_S3_BUCKET: ${S3_BUCKET:-castor}
    CASTOR_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
    CASTOR_S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    CASTOR_CORS_ORIGINS: ${CASTOR_CORS_ORIGINS:-http://localhost:8080}
    # Optional delivery channels for verification codes; empty disables the channel.
    CASTOR_MAIL_PASSWORD: ${CASTOR_MAIL_PASSWORD:-}
    CASTOR_SMS_ACCESS_KEY: ${CASTOR_SMS_ACCESS_KEY:-}
    CASTOR_SMS_SECRET_KEY: ${CASTOR_SMS_SECRET_KEY:-}
  volumes:
    - type: bind
      source: ${API_CONFIG_FILE:-./config/api.config.toml}
      target: /etc/castor/config.toml
      read_only: true
      bind:
        create_host_path: false
  tmpfs:
    - /app/logs:uid=10001,gid=10001,mode=0750
  stop_grace_period: 30s

services:
  init-db:
    <<: *api
    profiles: [tools]
    command: [init-db]
    restart: "no"
    environment:
      <<: *api-env
      CASTOR_DEFAULT_ADMIN_PASSWORD: ${CASTOR_DEFAULT_ADMIN_PASSWORD:?Set CASTOR_DEFAULT_ADMIN_PASSWORD}

  castor-api:
    <<: *api
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:1234/ready]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  castor-web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      CASTOR_API_URL: http://castor-api:1234
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      castor-api:
        condition: service_healthy
      castor-web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 3
