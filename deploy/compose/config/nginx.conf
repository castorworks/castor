# Docker DNS keeps upstream addresses fresh across application replacements.
resolver 127.0.0.11 valid=10s ipv6=off;
# Do not advertise the nginx version in responses or error pages.
server_tokens off;
server {
    listen 8080;
    server_name _;
    client_max_body_size 100m;

    # Inherited by both proxied locations; a location that sets any proxy_set_header
    # of its own stops inheriting all of these.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # This is the trust boundary: overwrite any client-supplied
    # X-Forwarded-For with the real peer so source IPs cannot be spoofed.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;

    location = /healthz { access_log off; return 200; }
    location /api/v1/ {
        set $api http://castor-api:1234;
        proxy_pass $api;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        set $web http://castor-web:3000;
        proxy_pass $web;
    }
}
