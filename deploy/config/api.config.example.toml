[General]
# 实例标识：小写字母/数字/'-'，1-32 字符（或环境变量 CASTOR_INSTANCE_ID）。
# 多套 Castor 共用同一个 Redis 时每套必须不同：它是本实例 Redis key 的前缀，也是 JWT 的 aud。
InstanceID = "castor"
Address = ":1234"
Development = false
JwtKey = ""  # ⚠️ 生产环境必须替换为足够复杂的随机字符串（建议 32+ 字符）
JwtTimeoutHours = 2        # 访问令牌有效期（小时），不得大于 JwtMaxRefreshHours
JwtMaxRefreshHours = 168   # 刷新窗口（小时），同时是登录授权会话的最长有效期与"记住我" cookie 的保存时长
RegisterEnabled = false  # 是否默认开放注册；数据库 Setting 配置可覆盖
ShutdownTimeout = 10  # 优雅关闭超时时间（秒）
MaxRequestBodyBytes = 10485760 # 非上传请求（JSON 等）的最大请求体字节数；multipart 上传使用 [Asset].MaxUploadSize
# 浏览器访问站点的 https 地址（不带路径，或环境变量 CASTOR_PUBLIC_URL）。只有启用 OIDC 登录时需要：回调地址由它拼出。
PublicURL = ""
# 受信任的反向代理 IP/CIDR，只有来自这些地址的请求才采信 X-Forwarded-For。
# ⚠️ 必须收敛为“实际的网关/负载均衡地址”，例如 Compose 网关容器 IP 或 K8s Ingress
# Controller 的地址；信任过宽的网段（如整个 RFC1918）会让任意内网客户端伪造来源 IP，
# 从而绕过限流并污染审计日志中的 IP。API 端口不得从公网直连。
# 下方仅为占位示例（Docker Compose 用户自定义网络的常见网段），部署前请替换为真实地址。
TrustedProxies = ["172.18.0.0/16"]

[CORS]
AllowOrigins = ["http://localhost:8080"]  # ⚠️ 生产环境必须配置具体域名，如 ["https://example.com"]，禁止使用 "*"
AllowMethods = ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
AllowHeaders = ["Content-Type", "Content-Length", "Accept-Encoding", "X-CSRF-Token", "Authorization", "accept", "origin", "Cache-Control", "X-Requested-With"]
AllowCredentials = true

[Captcha]
ExpireSeconds = 600  # 图形验证码过期时间（秒）
Length = 4           # 验证码长度
Width = 120          # 验证码图片宽度
Height = 40          # 验证码图片高度

[VerifyCode]
ExpireSeconds = 600  # 短信/邮件验证码过期时间（秒）
Length = 6           # 验证码位数（6-10）
MaxAttempts = 5      # 单个验证码最多校验次数，超过后作废，需重新获取

[Logger]
FilePath = "./logs/app.log"  # 日志文件路径
MaxSize = 32                  # 日志文件最大大小（MB）
MaxBackups = 15               # 保留的旧日志文件最大数量
MaxAge = 15                   # 保留的旧日志文件最大天数
Compress = true               # 是否压缩旧日志文件
Level = "info"                # 日志级别: debug, info, warn, error
Console = true                # 是否输出到控制台
Caller = false                # 是否输出调用者信息

[GinLogger]
FilePath = "./logs/gin.log"   # Gin 框架日志文件路径
MaxSize = 32                  # 日志文件最大大小（MB）
MaxBackups = 15               # 保留的旧日志文件最大数量
MaxAge = 15                   # 保留的旧日志文件最大天数
Compress = true               # 是否压缩旧日志文件
Console = true                # 是否输出到控制台

[Security]
RSAPrivateKeySecret = ""  # Redis 中 RSA 私钥的 AES-256-GCM 加密密钥
DataEncryptionKey = ""    # 加密库中 TOTP 密钥与 OIDC 客户端密钥（至少 32 字节，env CASTOR_DATA_KEY）；须与数据库一同备份

[I18n]
RootPath = "configs/i18n"
DefaultLanguage = "zh"
SupportedLanguages = ["zh", "en", "ja", "ko"]

[Module]
FileEnable = true

[Asset]
MaxUploadSize = 104857600  # 最大上传大小（字节），默认 100MB
OrphanAttachmentTTLHours = 24  # 无人引用的业务附件（上传后表单未保存等）保留多少小时后自动回收；0 表示不回收
# AllowedExtensions = [".pdf", ".png"]  # 允许的扩展名；不写则用 config.go 的缺省清单（图片、音视频、Office、pdf、txt/md/csv、压缩包）

[Postgres]
Host = "postgres"
Port = 5432
Username = "castor"
Password = ""
DbName = "castor"
SSLMode = "disable"
TimeZone = "Asia/Shanghai"
MaxOpenConns = 25                 # 最大打开连接数
MaxIdleConns = 10                 # 最大空闲连接数
ConnMaxLifetime = 300000000000    # 连接最大生命周期，单位纳秒（示例为 5 分钟）
ConnMaxIdleTime = 300000000000    # 空闲连接最大生命周期，单位纳秒（示例为 5 分钟）

[S3]
Endpoint = "rustfs:9000"    # host:port，或完整 http(s):// URL（URL 的协议优先于 Secure）
AccessKey = ""
Secret = ""
Bucket = "castor"
Region = "default"         # 签名地域：RustFS 等自建服务任意值即可；AWS S3 必须写 bucket 所在地域（不会自动探测）
Secure = false
ForcePathStyle = true      # RustFS 等自建服务保持 true

[Redis]
Username = ""
Password = ""
DB = 0
UseTLS = false

#==> mode: single node | config this
Address = "redis:6379"

#==> mode: cluster | config this
# ClusterAddresses = ["192.168.1.6:7000", "192.168.1.6:7001", "192.168.1.6:7002", "192.168.1.6:7003", "192.168.1.6:7004", "192.168.1.6:7005", "192.168.1.6:7006"]

#==> mode: sentinel | config this
# MasterName = "example"  # 哨兵模式必填
# SentinelAddresses = ["192.168.1.6:26379", "192.168.1.7:26379"]
# If you use a different set of credentials for sentinel add
# SentinelUsername = "user"
# SentinelPassword = "pass"

[Mail]
# 可选：Host 留空表示不启用邮件（邮件验证码提示未配置，通知不能勾选发送邮件）。
# 例如 Host = "smtp.your-provider.com"；example.com 一类的示例域名会被拒绝。
Host = ""
Port = 587
# 加密策略：留空=自动（465 端口用隐式 TLS，其他端口强制 STARTTLS，服务器不支持则发送失败）；
# 可选 "ssl" | "starttls" | "opportunistic"（有降级风险）| "none"（明文，仅用于受信任的内网中继）
TLSPolicy = ""
From = ""  # 默认发件人地址；为空时使用 Username，两者都为空则邮件发不出去
Username = ""
Password = ""  # 由 CASTOR_MAIL_PASSWORD 注入

[AliyunSms]
# 可选：AccessKey 与 SecretKey 都留空表示不启用短信验证码（服务照常启动，发送时提示未配置）；只填一个视为配置错误。
Region = "cn-hangzhou"
AccessKey = ""  # 由 CASTOR_SMS_ACCESS_KEY 注入
SecretKey = ""  # 由 CASTOR_SMS_SECRET_KEY 注入
SignName = "example"
TemplateCode = "example"
