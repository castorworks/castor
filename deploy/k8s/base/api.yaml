apiVersion: apps/v1
kind: Deployment
metadata:
  name: castor-api
  labels:
    castor.io/phase: application
spec:
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: castor-api
  template:
    metadata:
      labels:
        app: castor-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: castor/castor-api:local
          ports:
            - name: http
              containerPort: 1234
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          envFrom:
            - secretRef:
                name: castor-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/castor
              readOnly: true
            - name: logs
              mountPath: /app/logs
            # readOnlyRootFilesystem: multipart uploads over the in-memory
            # threshold spill to os.TempDir(), so /tmp must be writable.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: castor-config
            items:
              - key: config.toml
                path: config.toml
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
