apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: castor-api
  labels:
    castor.io/phase: application
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: castor-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
