apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: castor-staging
resources:
  - ../../base
  - namespace.yaml
configMapGenerator:
  - name: castor-config
    files:
      - config.toml=api.config.toml
secretGenerator:
  - name: castor-secrets
    envs: [secrets.env]
  - name: castor-bootstrap-secrets
    envs: [bootstrap.env]
generatorOptions:
  labels:
    castor.io/phase: configuration
images:
  - name: castor/castor-api
    newName: registry.example.com/castor/castor-api
    newTag: REPLACE_WITH_RELEASE
  - name: castor/castor-web
    newName: registry.example.com/castor/castor-web
    newTag: REPLACE_WITH_RELEASE
patches:
  - target:
      kind: Ingress
      name: castor
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: castor-staging.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: castor-staging.example.com
  # 实例标识：Redis key 前缀与 JWT aud。共用同一个 Redis 的每个 overlay 必须不同。
  - target:
      kind: Deployment
      name: castor-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: CASTOR_INSTANCE_ID
            value: castor-staging
